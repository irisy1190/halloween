/* Layout: a haunted-night poster header (moon, bats, cobweb, candy-corn band), sticky filters, then building "doors" street by street */
:root {
  --bg: #eef0ea; --surface: #ffffff; --ink: #1b241f; --muted: #5d6a62;

  --night: #0f1c18; --night-2: #18302a; --night-ink: #f3ead6; --bone: #f3ead6; --candy-y: #f6c33b;
  --display: "Karantina", "Heebo", sans-serif;
  --body: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1512; --surface: #15221e; --ink: #efeadf; --muted: #9db0a5;
  --line: #2a3d36; --pumpkin: #ff8a2a; --pumpkin-soft: #3a220f; --moss: #9be15d; --moss-soft: #1c2f17;
  --night: #070e0c; --night-2: #12251f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1512; --surface: #15221e; --ink: #efeadf; --muted: #9db0a5;
  --line: #2a3d36; --pumpkin: #ff8a2a; --pumpkin-soft: #3a220f; --moss: #9be15d; --moss-soft: #1c2f17;
  --night: #070e0c; --night-2: #12251f; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.hero { background: radial-gradient(120% 90% at 85% 0%, var(--night-2), var(--night) 70%); color: var(--night-ink); position: relative; overflow: hidden; }
header.hero .wrap { padding-block: 30px 40px; position: relative; z-index: 1; display: grid; gap: 8px; }
.hero .txt { display: grid; gap: 8px; margin-inline-end: 104px; min-width: 0; }
@media (min-width: 560px) { .hero .txt { margin-inline-end: 150px; } }
.hero .kicker { font-size: 13px; letter-spacing: .12em; color: var(--candy-y); margin: 0; }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(54px, 15vw, 88px); line-height: .85; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--pumpkin); display: block; }
.hero .streets { color: #b9c7bd; font-size: 14px; margin: 4px 0 0; max-width: 46ch; }
.hero .when { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.hero .when span { background: rgba(243,234,214,.08); border: 1px solid rgba(243,234,214,.18); border-radius: 8px; padding: 5px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.hero .when b { color: var(--candy-y); font-weight: 700; }
.moon { position: absolute; inset-inline-end: 5%; top: 22px; width: 84px; height: 84px; border-radius: 50%;
  background: radial-gradient(circle at 38% 36%, #fff6dc, #f3dca0 60%, #d9b867); box-shadow: 0 0 60px 10px rgba(246,214,140,.25); }
.bats { position: absolute; inset-inline-end: 3%; top: 104px; width: 150px; height: 60px; color: #050a08; }
.web { position: absolute; top: 0; inset-inline-start: 0; width: 140px; height: 140px; color: rgba(243,234,214,.38); }
.web .spider { fill: rgba(243,234,214,.55); }
.candy { height: 10px; background: linear-gradient(90deg, var(--candy-y) 0 33.3%, var(--pumpkin) 33.3% 66.6%, var(--bone) 66.6% 100%); }
@media (prefers-reduced-motion: no-preference) {
  .bats { animation: flap 6s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: translate(-14px, -8px); } }
}
.vault { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 18px; display: grid; gap: 10px; }
.vault p { margin: 0; color: var(--muted); font-size: 14px; }
.vault h2 { margin: 0; font-size: 16px; }
.vault form { display: flex; gap: 8px; flex-wrap: wrap; }
.vault input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button, .btn { font: inherit; font-weight: 500; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--pumpkin); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: 2px; }
.vault.open { border-color: var(--moss); background: var(--moss-soft); }
.vault .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.err { color: var(--pumpkin); font-weight: 500; }

.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); margin-top: 14px; display: grid; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: 13.5px; border-radius: 999px; font-weight: 400; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg .lbl { font-size: 12px; color: var(--muted); align-self: center; letter-spacing: .02em; min-width: 3.6em; }
.searchrow { display: flex; gap: 8px; }
.searchrow input, .searchrow select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.searchrow input { flex: 1; }
.count { color: var(--muted); font-size: 13px; margin: 14px 0 6px; }

.street { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.street small { font-family: var(--body); font-size: 13px; color: var(--muted); }
.bldg { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 10px 10px; border-top: 3px solid var(--pumpkin); margin-bottom: 10px; overflow: hidden; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
.bhead h3 { margin: 0; font-size: 18px; font-weight: 700; }
.bhead h3 .warn { font-size: 12px; font-weight: 500; color: var(--pumpkin); margin-inline-start: 6px; }
.nav { display: flex; gap: 6px; }
.nav a { font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.apt { display: grid; grid-template-columns: 4.6em 1fr auto; gap: 4px 12px; padding: 10px 14px; border-top: 1px dashed var(--line); align-items: start; }
.apt .num { font-variant-numeric: tabular-nums; }
.apt .num b { display: block; font-size: 20px; line-height: 1.1; }
.apt .num span { font-size: 12px; color: var(--muted); }
.apt .who { min-width: 0; display: grid; gap: 4px; }
.apt .who strong { font-weight: 500; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; background: var(--pumpkin-soft); color: var(--ink); border-radius: 8px; padding: 3px 8px; justify-self: start; }
.scare { text-align: end; display: grid; gap: 2px; justify-items: end; }
.pips { display: flex; gap: 3px; direction: rtl; }
.pip { width: 13px; height: 11px; border-radius: 45%; background: var(--line); position: relative; margin-top: 3px; }
.pip::before { content: ""; position: absolute; width: 2px; height: 4px; top: -3px; left: 5.5px; background: var(--line); border-radius: 1px; }
.pip.on::before { background: var(--moss); }
.pip.on { background: var(--pumpkin); }
.scare small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.code { grid-column: 2 / -1; font-size: 13.5px; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.code b { color: var(--moss); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
footer { color: var(--muted); font-size: 13px; padding-block: 26px 40px; }
@media (prefers-reduced-motion: no-preference) { .bldg { transition: border-color .2s; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-top: 20px; display: grid; gap: 14px; text-align: center; }
.card h2 { font-family: var(--display); font-size: 40px; line-height: 1; margin: 0; }
.card .where { color: var(--muted); margin: 0; }
.state { font-size: 18px; font-weight: 700; padding: 10px; border-radius: 12px; }
.state.has { background: var(--pumpkin-soft); color: var(--pumpkin); }
.state.out { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.big { font-size: 22px; padding: 22px 16px; border-radius: 16px; justify-content: center; width: 100%; }
.big.back { background: var(--moss); }
.big[disabled] { opacity: .6; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.msg { font-weight: 500; min-height: 1.5em; margin: 0; }
a.home { color: var(--ink); }
</style>
</head>

  }
  draw();
  ref.onSnapshot(d => { out = !!(d.exists && d.data().out); ready = true; draw(); }, () => { ready = true; draw("אין חיבור כרגע. נסו לרענן את הדף."); });
}
</script>
