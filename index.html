<html lang="he" dir="rtl">
<head>

<title>ממתק או תעלול בשכונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: a haunted-night poster header (moon, bats, cobweb, candy-corn band), sticky filters, then building "doors" street by street */
:root {
  --bg: #eef0ea; --surface: #ffffff; --ink: #1b241f; --muted: #5d6a62;
  --line: #d3dacf; --pumpkin: #d65a0c; --pumpkin-soft: #fde5d2; --moss: #3d7d1f; --moss-soft: #e2f1d6;
  --night: #0f1c18; --night-2: #18302a; --night-ink: #f3ead6; --bone: #f3ead6; --candy-y: #f6c33b;
  --display: "Karantina", "Heebo", sans-serif;
  --body: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1512; --surface: #15221e; --ink: #efeadf; --muted: #9db0a5;
  --line: #2a3d36; --pumpkin: #ff8a2a; --pumpkin-soft: #3a220f; --moss: #9be15d; --moss-soft: #1c2f17;
  --night: #070e0c; --night-2: #12251f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1512; --surface: #15221e; --ink: #efeadf; --muted: #9db0a5;
  --line: #2a3d36; --pumpkin: #ff8a2a; --pumpkin-soft: #3a220f; --moss: #9be15d; --moss-soft: #1c2f17;
  --night: #070e0c; --night-2: #12251f; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.hero { background: radial-gradient(120% 90% at 85% 0%, var(--night-2), var(--night) 70%); color: var(--night-ink); position: relative; overflow: hidden; }
header.hero .wrap { padding-block: 30px 40px; position: relative; z-index: 1; display: grid; gap: 8px; }
.hero .txt { display: grid; gap: 8px; margin-inline-end: 104px; min-width: 0; }
@media (min-width: 560px) { .hero .txt { margin-inline-end: 150px; } }
.hero .kicker { font-size: 13px; letter-spacing: .12em; color: var(--candy-y); margin: 0; }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(54px, 15vw, 88px); line-height: .85; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--pumpkin); display: block; }
.hero .streets { color: #b9c7bd; font-size: 14px; margin: 4px 0 0; max-width: 46ch; }
.hero .when { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.hero .when span { background: rgba(243,234,214,.08); border: 1px solid rgba(243,234,214,.18); border-radius: 8px; padding: 5px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.hero .when b { color: var(--candy-y); font-weight: 700; }
.moon { position: absolute; inset-inline-end: 5%; top: 22px; width: 84px; height: 84px; border-radius: 50%;
  background: radial-gradient(circle at 38% 36%, #fff6dc, #f3dca0 60%, #d9b867); box-shadow: 0 0 60px 10px rgba(246,214,140,.25); }
.bats { position: absolute; inset-inline-end: 3%; top: 104px; width: 150px; height: 60px; color: #050a08; }
.web { position: absolute; top: 0; inset-inline-start: 0; width: 140px; height: 140px; color: rgba(243,234,214,.38); }
.web .spider { fill: rgba(243,234,214,.55); }
.candy { height: 10px; background: linear-gradient(90deg, var(--candy-y) 0 33.3%, var(--pumpkin) 33.3% 66.6%, var(--bone) 66.6% 100%); }
@media (prefers-reduced-motion: no-preference) {
  .bats { animation: flap 6s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: translate(-14px, -8px); } }
}
.vault { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 18px; display: grid; gap: 10px; }
.vault p { margin: 0; color: var(--muted); font-size: 14px; }
.vault h2 { margin: 0; font-size: 16px; }
.vault form { display: flex; gap: 8px; flex-wrap: wrap; }
.vault input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button, .btn { font: inherit; font-weight: 500; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--pumpkin); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: 2px; }
.vault.open { border-color: var(--moss); background: var(--moss-soft); }
.vault .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.err { color: var(--pumpkin); font-weight: 500; }

.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); margin-top: 14px; display: grid; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: 13.5px; border-radius: 999px; font-weight: 400; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg .lbl { font-size: 12px; color: var(--muted); align-self: center; letter-spacing: .02em; min-width: 3.6em; }
.searchrow { display: flex; gap: 8px; }
.searchrow input, .searchrow select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.searchrow input { flex: 1; }
.count { color: var(--muted); font-size: 13px; margin: 14px 0 6px; }

.street { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.street small { font-family: var(--body); font-size: 13px; color: var(--muted); }
.bldg { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 10px 10px; border-top: 3px solid var(--pumpkin); margin-bottom: 10px; overflow: hidden; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
.bhead h3 { margin: 0; font-size: 18px; font-weight: 700; }
.bhead h3 .warn { font-size: 12px; font-weight: 500; color: var(--pumpkin); margin-inline-start: 6px; }
.nav { display: flex; gap: 6px; }
.nav a { font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.apt { display: grid; grid-template-columns: 4.6em 1fr auto; gap: 4px 12px; padding: 10px 14px; border-top: 1px dashed var(--line); align-items: start; }
.apt .num { font-variant-numeric: tabular-nums; }
.apt .num b { display: block; font-size: 20px; line-height: 1.1; }
.apt .num span { font-size: 12px; color: var(--muted); }
.apt .who { min-width: 0; display: grid; gap: 4px; }
.apt .who strong { font-weight: 500; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; background: var(--pumpkin-soft); color: var(--ink); border-radius: 8px; padding: 3px 8px; justify-self: start; }
.scare { text-align: end; display: grid; gap: 2px; justify-items: end; }
.pips { display: flex; gap: 3px; direction: rtl; }
.pip { width: 13px; height: 11px; border-radius: 45%; background: var(--line); position: relative; margin-top: 3px; }
.pip::before { content: ""; position: absolute; width: 2px; height: 4px; top: -3px; left: 5.5px; background: var(--line); border-radius: 1px; }
.pip.on::before { background: var(--moss); }
.pip.on { background: var(--pumpkin); }
.scare small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.code { grid-column: 2 / -1; font-size: 13.5px; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.code b { color: var(--moss); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
footer { color: var(--muted); font-size: 13px; padding-block: 26px 40px; }
@media (prefers-reduced-motion: no-preference) { .bldg { transition: border-color .2s; } }

/* website additions */
.tabs { display: flex; gap: 6px; margin-top: 16px; }
.tabs button { flex: 1; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-weight: 700; justify-content: center; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; font-size: 14px; }
.status .pill { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.has { background: var(--pumpkin); } .dot.out { background: #8a958e; }
.status .live { color: var(--muted); font-size: 12.5px; }
#map { height: min(68vh, 560px); border-radius: 16px; border: 1px solid var(--line); margin-top: 12px; z-index: 0; }
.maptools { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.maptools button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 13.5px; padding: 7px 12px; }
.pin { width: 34px; height: 34px; display: grid; place-items: center; }
.pin svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.pin b { position: absolute; top: -6px; inset-inline-end: -6px; background: #1b241f; color: #fff; font: 700 11px/18px Heebo, sans-serif; min-width: 18px; height: 18px; border-radius: 9px; text-align: center; padding: 0 4px; }
.me { width: 16px; height: 16px; border-radius: 50%; background: #2b7bff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(43,123,255,.25); }
.leaflet-popup-content { margin: 12px 14px; font-family: var(--body); direction: rtl; text-align: right; min-width: 210px; }
.leaflet-popup-content h4 { margin: 0 0 6px; font-size: 16px; }
.pop-apt { border-top: 1px dashed #ccc; padding: 6px 0; display: grid; gap: 2px; font-size: 13.5px; }
.pop-apt .st { font-size: 12px; font-weight: 700; }
.pop-apt .st.has { color: #c4500a; } .pop-apt .st.out { color: #6b766f; }
.pop-nav { display: flex; gap: 6px; margin-top: 8px; }
.pop-nav a { font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid #ccc; text-decoration: none; color: #1b241f; }
.candy-st { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.candy-st.has { background: var(--pumpkin-soft); color: var(--pumpkin); }
.candy-st.out { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.apt.isout { opacity: .55; }
</style>
</head>

<div>
<header class="hero">
  <div class="moon" aria-hidden="true"></div>
  <svg class="bats" viewBox="0 0 150 60" aria-hidden="true"><g fill="currentColor">

    <path transform="translate(108 0) scale(.5)" d="M30 22c-6-8-14-9-22-6 6 1 9 5 9 9 4-3 8-2 10 1 1-3 3-4 5-4 2 0 4 1 5 4 2-3 6-4 10-1 0-4 3-8 9-9-8-3-16-2-22 6-1-2-3-3-4-3s-3 1-4 3z"/></g></svg>

  <div class="wrap">

    </div>

</header>

<main class="wrap">
  <div class="status" aria-live="polite">
    <span class="pill"><span class="dot has"></span><span id="nHas">–</span> עם ממתקים</span>
    <span class="pill"><span class="dot out"></span><span id="nOut">–</span> נגמרו</span>
    <span class="live" id="live">טוענים מצב ממתקים…</span>

  <section class="vault" id="vault" aria-live="polite"></section>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabMap" aria-selected="true">🗺️ מפה</button>
    <button type="button" role="tab" id="tabList" aria-selected="false">🏘️ רשימת הבתים</button>
  </div>


  <div class="filters" role="group" aria-label="סינון">
    <div class="seg" id="segRound"><span class="lbl">סבב</span></div>
    <div class="seg" id="segScare"><span class="lbl">הפחדה</span></div>
    <div class="seg" id="segCandy"><span class="lbl">ממתקים</span></div>
    <div class="searchrow" id="searchRow" hidden>
      <input id="q" type="search" placeholder="חיפוש שם או מספר בניין" aria-label="חיפוש">
      <select id="street" aria-label="רחוב"></select>
    </div>
  </div>

  <section id="mapView">
    <div id="map" role="region" aria-label="מפת הבתים המשתתפים"></div>
    <div class="maptools">
      <button type="button" id="btnMe">◎ איפה אני?</button>
      <button type="button" id="btnAll">⌖ כל הבתים</button>
    </div>
  </section>

  <section id="listView" hidden>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </section>

  <footer>רוצים להצטרף או לעדכן פרטים? כתבו למארגנים בקבוצת הווטסאפ של השכונה. שומרים על השכנים: לא מעבירים את קוד האירוע מחוץ לקבוצה.</footer>
</main>
</div>

async function unlock(pw) {

  return JSON.parse(new TextDecoder().decode(plain));
}

  });
}

function matches(h, ignoreText) {
  if (state.round !== "all" && !h.rounds.includes(state.round)) return false;
  if (state.scare !== "all") {
    const s = h.scare;
    if (state.scare === "low" && !(s && s <= 2)) return false;
    if (state.scare === "mid" && s !== 3) return false;
    if (state.scare === "high" && !(s && s >= 4)) return false;
  }
  if (state.candy === "has" && isOut(h)) return false;
  if (ignoreText) return true;
  if (state.street !== "all" && h.street !== state.street) return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    if (![h.name, h.street, h.num, h.street + " " + h.num].some(x => String(x).toLowerCase().includes(q))) return false;
  }
  return true;
}

  return `דירה ${h.apt.replace(" ביחד","")}` + (h.floor ? (h.floor === "קרקע" ? " · קרקע" : ` · קומה ${h.floor}`) : "");
};
const codeText = h => !h.hasCode ? "אין צורך בקוד" : codes ? `קוד כניסה <b>${esc(codes[h.id] || "")}</b>` : "קוד כניסה נעול";

function aptRow(h) {
  const isApt = h.apt && /^[0-9+ ]+/.test(h.apt) && !/[א-ת]/.test(h.apt.replace("ביחד",""));
  const numBlock = h.apt
    ? (isApt ? `<b>${esc(h.apt.replace(" ביחד",""))}</b><span>${h.floor ? (h.floor === "קרקע" ? "קומת קרקע" : "קומה " + esc(h.floor)) : ""}</span>`
             : `<b style="font-size:14px">${esc(h.apt)}</b>`)
    : `<b style="font-size:14px">ברחוב</b>`;
  return `<div class="apt${statusLoaded && isOut(h) ? " isout" : ""}"><div class="num">${numBlock}</div>
    <div class="who"><strong>${esc(h.name)}</strong>
      <div class="chips">${candyChip(h)}${h.rounds.map(r => `<span class="chip">${ROUND_LABEL[r]}</span>`).join("")}</div>
      ${h.note ? `<span class="note">${esc(h.note)}</span>` : ""}</div>
    ${pips(h.scare)}<div class="code">${codeText(h)}</div></div>`;
}

const navLinks = addr => { const e = encodeURIComponent(addr);
  return `<a href="https://waze.com/ul?q=${e}&navigate=yes" target="_blank" rel="noopener">וייז</a><a href="https://www.google.com/maps/search/?api=1&query=${e}" target="_blank" rel="noopener">גוגל מפות</a>`; };

function renderList() {
  const shown = HOUSES.filter(h => matches(h));
  const byStreet = new Map();
  shown.forEach(h => {
    if (!byStreet.has(h.street)) byStreet.set(h.street, new Map());
    const b = byStreet.get(h.street); const k = h.num || "?";
    if (!b.has(k)) b.set(k, []); b.get(k).push(h);
  });
  const streets = [...byStreet.keys()].sort((a, b) => byStreet.get(b).size - byStreet.get(a).size || a.localeCompare(b, "he"));
  let html = "";
  streets.forEach(st => {
    const blds = byStreet.get(st);
    const n = [...blds.values()].reduce((a, x) => a + x.length, 0);
    html += `<h2 class="street">${esc(st)} <small>${n} ${n === 1 ? "בית" : "בתים"}</small></h2>`;
    [...blds.keys()].sort((a, b) => (parseInt(a) || 999) - (parseInt(b) || 999)).forEach(num => {
      const list = blds.get(num).sort((a, b) => (parseInt(a.floor) || 0) - (parseInt(b.floor) || 0));
      const addr = num === "?" ? `${st}, ${CITY}` : `${st} ${num}, ${CITY}`;
      html += `<article class="bldg"><div class="bhead"><h3>${esc(st)} ${num === "?" ? "" : esc(num)}${num === "?" ? `<span class="warn">מספר בניין חסר</span>` : ""}</h3>
        <div class="nav">${navLinks(addr)}</div></div>${list.map(aptRow).join("")}</article>`;
    });
  });
  $("#list").innerHTML = html || `<p class="empty">אין בתים שמתאימים לסינון הזה.</p>`;
  const b = new Set(shown.map(h => h.street + h.num)).size;
  $("#count").textContent = `${shown.length} בתים משתתפים ב־${b} בניינים`;
}

/* ---------- map ---------- */
let map, layer, meMarker;
const pumpkin = (fill, stem) => `<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 8c-1-3 0-5 2-6" stroke="${stem}" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="11.5" cy="20" rx="8" ry="10" fill="${fill}"/><ellipse cx="22.5" cy="20" rx="8" ry="10" fill="${fill}"/><ellipse cx="17" cy="20" rx="7" ry="11" fill="${fill}" stroke="rgba(0,0,0,.18)" stroke-width="1"/><path d="M11 18l3 2-3 1zM23 18l-3 2 3 1zM12 25q5 4 10 0l-2 1-1-1-2 1-2-1-1 1z" fill="#2a1a0c" opacity=".85"/></svg>`;
function initMap() {
  if (map || typeof L === "undefined") return;
  map = L.map("map", { zoomControl: true, attributionControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
}
function renderMap(fit) {
  initMap(); if (!map) return;
  layer.clearLayers();
  const groups = new Map();
  HOUSES.filter(h => h.lat && matches(h, true)).forEach(h => {
    const k = h.lat + "," + h.lng; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(h);
  });
  const pts = [];
  groups.forEach(list => {
    const h0 = list[0]; const ll = [h0.lat, h0.lng]; pts.push(ll);
    const open = list.filter(h => !isOut(h)).length;
    const icon = L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 30], popupAnchor: [0, -26],
      html: `<div class="pin">${open ? pumpkin("#f2741c", "#3d7d1f") : pumpkin("#9aa39d", "#6b766f")}${list.length > 1 ? `<b>${list.length}</b>` : ""}</div>` });
    const addr = `${h0.street} ${h0.num}, ${CITY}`;
    const body = `<h4>${esc(h0.street)} ${esc(h0.num)}</h4>` + list.map(h => `<div class="pop-apt"><strong>${esc(h.name)}</strong>
      <span>${esc(where(h))} · ${h.rounds.map(r => ROUND_LABEL[r]).join(", ")}${h.scare ? ` · הפחדה ${h.scare}/5` : ""}</span>
      ${statusLoaded ? `<span class="st ${isOut(h) ? "out" : "has"}">${isOut(h) ? "נגמרו הממתקים" : "יש ממתקים"}</span>` : ""}
      ${h.note ? `<span>${esc(h.note)}</span>` : ""}<span>${codeText(h)}</span></div>`).join("") + `<div class="pop-nav">${navLinks(addr)}</div>`;
    L.marker(ll, { icon, title: addr }).bindPopup(body).addTo(layer);
  });
  if (fit && pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 17 });
}

function counts() {
  const out = HOUSES.filter(isOut).length;
  $("#nHas").textContent = HOUSES.length - out; $("#nOut").textContent = out;
}
let firstMap = true;
function render() {
  counts();
  if (state.view === "map") { renderMap(firstMap); firstMap = false; } else renderList();
}

function setView(v) {
  state.view = v;
  $("#tabMap").setAttribute("aria-selected", v === "map"); $("#tabList").setAttribute("aria-selected", v === "list");
  $("#mapView").hidden = v !== "map"; $("#listView").hidden = v !== "list"; $("#searchRow").hidden = v !== "list";
  render(); if (v === "map" && map) setTimeout(() => map.invalidateSize(), 50);
}
$("#tabMap").onclick = () => setView("map");
$("#tabList").onclick = () => setView("list");
$("#btnAll").onclick = () => renderMap(true);
$("#btnMe").onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (meMarker) meMarker.setLatLng(ll); else meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16,16] }) }).addTo(map);
    map.setView(ll, 17);
  }, () => alert("לא הצלחנו לאתר את המיקום. בדקו שהרשאת המיקום פתוחה לדפדפן."), { enableHighAccuracy: true, timeout: 10000 });
};

seg("#segRound", "round", [["all","הכל"],["17-19","17:00–19:00"],["19-21","19:00–21:00"]]);
seg("#segScare", "scare", [["all","הכל"],["low","1–2 לקטנטנים"],["mid","3"],["high","4–5 לאמיצים"]]);
seg("#segCandy", "candy", [["all","כל הבתים"],["has","רק איפה שיש ממתקים"]]);
const sel = $("#street");
sel.innerHTML = `<option value="all">כל הרחובות</option>` + [...new Set(HOUSES.map(h => h.street))].sort((a,b)=>a.localeCompare(b,"he")).map(s => `<option>${esc(s)}</option>`).join("");
sel.onchange = () => { state.street = sel.value; render(); };
$("#q").oninput = e => { state.q = e.target.value.trim(); render(); };

/* ---------- live candy status ---------- */
function startStatus() {
  if (!FIREBASE || typeof firebase === "undefined") { $("#live").textContent = "מצב הממתקים עוד לא מחובר"; return; }
  firebase.initializeApp(FIREBASE);
  firebase.firestore().collection("status").onSnapshot(snap => {
    OUT = {}; snap.forEach(d => { if (d.data().out) OUT[d.id] = true; });
    statusLoaded = true;
    $("#live").textContent = "מתעדכן בזמן אמת · " + new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
    render();
  }, () => { $("#live").textContent = "אין חיבור למצב הממתקים כרגע"; });
}

renderVault(); setView("map"); startStatus();
(async () => { let pw = null; try { pw = localStorage.getItem("boo-pw"); } catch(e){}
  if (pw) { try { codes = await unlock(pw); renderVault(); render(); } catch(e){} } })();
</script>
</body>
